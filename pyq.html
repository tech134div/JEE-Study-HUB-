<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JEE Study Hub - PYQ</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,sans-serif;
    background:#0d0b18;
    color:white;
    padding-bottom:40px;
}

header{
    text-align:center;
    padding:25px 15px;
}

header a{
    color:#b9a8ff;
    text-decoration:none;
}

h1{
    margin:12px 0;
    font-size:30px;
}

.container{
    max-width:750px;
    margin:auto;
    padding:15px;
}

.card{
    background:#171329;
    border:1px solid #30265a;
    border-radius:20px;
    padding:22px;
    margin:16px 0;
}

.question{
    font-size:19px;
    line-height:1.6;
    margin-bottom:20px;
}

.options{
    display:grid;
    gap:10px;
}

.option{
    background:#211b38;
    border:1px solid #3b3260;
    color:white;
    padding:14px;
    border-radius:12px;
    text-align:left;
    cursor:pointer;
}

.option.selected{
    border-color:#8b5cf6;
    background:#302252;
}

.option.correct{
    background:#14532d;
    border-color:#22c55e;
}

.option.wrong{
    background:#5f1d2a;
    border-color:#ef4444;
}

button{
    border:0;
    border-radius:12px;
    padding:13px 18px;
    background:#7c3aed;
    color:white;
    font-weight:bold;
    cursor:pointer;
    margin:6px 4px 0 0;
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.timer{
    text-align:center;
    font-size:40px;
    font-weight:bold;
    color:#c4b5fd;
    margin:10px 0 20px;
}

.timer.warning{
    color:#ef4444;
}

.info{
    display:flex;
    justify-content:space-between;
    color:#aaa;
    margin-bottom:15px;
}

.result{
    margin-top:18px;
    padding:15px;
    border-radius:12px;
    background:#211b38;
    line-height:1.6;
}

select{
    width:100%;
    padding:13px;
    border-radius:10px;
    border:1px solid #4b3b77;
    background:#211b38;
    color:white;
    font-size:16px;
}
</style>
</head>

<body>

<header>
    <a href="chapters.html">← Back to Chapters</a>
    <h1>🔥 PYQ Practice</h1>
</header>

<div class="container">

<div class="card">

    <h2>📚 Select Chapter</h2>

    <select id="chapterSelect" onchange="loadQuestions()">
        <option value="Kinematics">Kinematics</option>
        <option value="Laws of Motion">Laws of Motion</option>
        <option value="Work, Energy & Power">Work, Energy & Power</option>
        <option value="Mole Concept">Mole Concept</option>
        <option value="Atomic Structure">Atomic Structure</option>
        <option value="Quadratic Equations">Quadratic Equations</option>
        <option value="Trigonometry">Trigonometry</option>
    </select>

    <button id="alarmBtn" onclick="enableAlarm()">
        🔔 Enable Alarm
    </button>

</div>


<div class="card">

    <div class="info">
        <span id="questionNumber">Question 1</span>
        <span>Score: <b id="score">0</b></span>
    </div>

    <div class="timer" id="timer">01:00</div>

    <div class="question" id="question">
        Loading question...
    </div>

    <div class="options" id="options"></div>

    <div>
        <button id="submitBtn" onclick="submitAnswer()">
            Submit Answer
        </button>

        <button id="nextBtn" onclick="nextQuestion()" disabled>
            Next →
        </button>
    </div>

    <div id="result"></div>

</div>


<div class="card">

    <h2>📊 Practice Result</h2>

    <p style="margin-top:12px">
        Attempted: <b id="attempted">0</b>
    </p>

    <p style="margin-top:10px">
        Correct: <b id="correct">0</b>
    </p>

    <p style="margin-top:10px">
        Accuracy: <b id="accuracy">0%</b>
    </p>

    <button onclick="finishChapter()">
        ✅ Finish PYQ
    </button>

</div>

</div>


<script>

/* =========================
   QUESTION DATA
========================= */

const questionData = {

"Kinematics":[

{
q:"A particle moves with constant acceleration. Its velocity changes from 10 m/s to 20 m/s in 5 s. What is its acceleration?",
options:[
"1 m/s²",
"2 m/s²",
"3 m/s²",
"4 m/s²"
],
answer:1
},

{
q:"The slope of a velocity-time graph represents:",
options:[
"Displacement",
"Speed",
"Acceleration",
"Distance"
],
answer:2
}
