<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JEE Study Hub - Theory</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,sans-serif;
    background:#0d0b18;
    color:white;
    padding-bottom:40px;
}

header{
    text-align:center;
    padding:25px 15px;
}

header a{
    color:#b9a8ff;
    text-decoration:none;
}

.container{
    max-width:750px;
    margin:auto;
    padding:15px;
}

.card{
    background:#171329;
    border:1px solid #30265a;
    border-radius:20px;
    padding:22px;
    margin:16px 0;
}

h1{
    font-size:30px;
    margin:12px 0;
}

h2{
    color:#c4b5fd;
    margin:20px 0 10px;
}

p,li{
    color:#ddd;
    line-height:1.7;
    font-size:16px;
}

ul{
    padding-left:22px;
}

.formula{
    background:#211b38;
    border-left:4px solid #8b5cf6;
    padding:15px;
    border-radius:10px;
    margin:12px 0;
    font-size:18px;
}

button{
    border:0;
    border-radius:12px;
    padding:13px 18px;
    background:#7c3aed;
    color:white;
    font-weight:bold;
    cursor:pointer;
    margin-top:15px;
}

.complete{
    background:#16a34a;
}
